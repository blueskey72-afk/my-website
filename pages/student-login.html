<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="../css/style.css">

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="../css/login.css">

</head>


<body>

    <!-- LOGIN PAGE -->

    <main class="login-page">

        <div class="login-box">

            <!-- ICON -->

            <div class="login-icon">
                🎓
            </div>


            <!-- TITLE -->

            <h1>
                Student Login
            </h1>

            <p class="login-subtitle">
                Login to Student Dashboard
            </p>


            <!-- USER ID -->

            <div class="input-group">

                <label for="studentUserId">
                    User ID
                </label>

                <input
                    type="text"
                    id="studentUserId"
                    placeholder="Enter User ID"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="studentPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="studentPassword"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                class="login-btn"
                onclick="studentLogin()">

                LOGIN

            </button>


            <!-- ERROR MESSAGE -->

            <p
                id="loginMessage"
                class="login-message">
            </p>


            <!-- NOTE -->

            <p class="login-note">
                🔒 Authorized Student only
            </p>


            <!-- BACK BUTTON -->

            <a
                href="../index.html"
                class="back-link">

                ← Back to Home

            </a>

        </div>

    </main>


    <!-- LOGIN JAVASCRIPT -->

    <script src="../js/login.js"></script>

</body>

</html>
